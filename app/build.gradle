plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.christopher.weighttracker'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.christopher.weighttracker"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Exports the schema Room derives from the @Entity classes to app/schemas/.
        // Committed to version control: it is a readable record of what the annotation
        // processor actually generated, and it is a precondition for MigrationTestHelper
        // if real migrations are ever added.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // Declared explicitly: the app has always used RecyclerView, but was resolving it
    // only transitively through com.google.android.material. A Material version bump
    // could have removed it and broken the build.
    implementation libs.recyclerview

    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.runtime

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}